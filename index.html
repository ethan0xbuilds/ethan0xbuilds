<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a3e;
            --secondary: #16213e;
            --accent: #0f3460;
            --highlight: #16a085;
            --light: #eaeaea;
            --text: #333;
            --text-light: #666;
            --border: #ddd;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #0f1419;
                --secondary: #1a2332;
                --accent: #1e3a5f;
                --highlight: #16a085;
                --light: #f5f5f5;
                --text: #e0e0e0;
                --text-light: #a0a0a0;
                --border: #333;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 30px;
            animation: slideUp 0.6s ease-out;
        }

        @media (prefers-color-scheme: dark) {
            .container {
                background: rgba(15, 20, 25, 0.95);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--highlight) 0%, var(--accent) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(22, 160, 133, 0.3);
            overflow: hidden;
            border: 3px solid var(--highlight);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text);
        }

        .title {
            font-size: 16px;
            color: var(--highlight);
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Social Links Section */
        .social-section {
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(22, 160, 133, 0.08);
            border-radius: 12px;
            border-left: 4px solid var(--highlight);
        }

        .social-section h3 {
            font-size: 14px;
            color: var(--highlight);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .social-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        @media (max-width: 480px) {
            .social-links {
                grid-template-columns: 1fr;
            }
        }

        .social-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 10px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: center;
        }

        @media (prefers-color-scheme: dark) {
            .social-link {
                background: rgba(255, 255, 255, 0.05);
            }
        }

        .social-link:hover {
            border-color: var(--highlight);
            color: var(--highlight);
            transform: translateY(-2px);
        }

        .social-icon {
            font-size: 18px;
        }

        /* Content Section */
        .content-section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 8px;
        }

        @media (prefers-color-scheme: dark) {
            .content-section {
                background: rgba(255, 255, 255, 0.03);
            }
        }

        .content-section h3 {
            font-size: 14px;
            color: var(--highlight);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .project-card {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        @media (prefers-color-scheme: dark) {
            .project-card {
                background: rgba(255, 255, 255, 0.05);
            }
        }

        .project-card:hover {
            border-color: var(--highlight);
            color: var(--highlight);
            transform: translateX(4px);
        }

        .project-card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .project-card-name {
            font-weight: 600;
        }

        .project-card-desc {
            font-size: 12px;
            color: var(--text-light);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-light);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .name {
                font-size: 24px;
            }

            .header {
                margin-bottom: 25px;
            }

            .avatar {
                width: 100px;
                height: 100px;
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="avatar">
                <img src="avatar.png" alt="Ethan" />
            </div>
            <h1 class="name">Ethan</h1>
            <div class="title">某不知名程序员</div>
        </div>

        <!-- Social Links Section -->
        <div class="social-section">
            <h3>Connect</h3>
            <div class="social-links">
                <a href="https://x.com/ethan0xbuilds" target="_blank" rel="noopener noreferrer" class="social-link">
                    <span class="social-icon">𝕏</span>
                    <span>X / Twitter</span>
                </a>
                <a href="https://t.me/ethan0xbuilds" target="_blank" rel="noopener noreferrer" class="social-link">
                    <span class="social-icon">✈️</span>
                    <span>Telegram</span>
                </a>
                <a href="https://discord.com/users/ethan0xbuilds" target="_blank" rel="noopener noreferrer" class="social-link">
                    <span class="social-icon">💬</span>
                    <span>Discord</span>
                </a>
            </div>
        </div>

        <!-- Projects Section -->
        <div class="content-section">
            <h3>Featured Projects</h3>
            <a href="https://github.com/ethan0xbuilds/ai-context-vault-cn" target="_blank" rel="noopener noreferrer" class="project-card">
                <span style="font-size:20px">🗄️</span>
                <div class="project-card-info">
                    <span class="project-card-name">ai-context-vault-cn</span>
                    <span class="project-card-desc">AI context management tool (Chinese edition)</span>
                </div>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2026 Ethan. Deployed on www.oasaka.xyz</p>
        </div>
    </div>
</body>
</html>
